repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # `!reference` etc. are not used, but action files are valid YAML only
        # when parsed as plain documents — keep the default parser.
        files: ^\.github/.*\.ya?ml$
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # The Typst CLI has no `fmt` subcommand; `typstyle` is the community formatter.
  # Requires `cargo install typstyle --locked` on the machine running pre-commit.
  - repo: local
    hooks:
      - id: typstyle
        name: Typst format (typstyle 0.15.1)
        # Keep in sync with `.github/actions/setup/action.yaml`; a version skew makes
        # local formatting and CI disagree. Bumping the pin means re-running `just fmt`.
        entry: typstyle --inplace
        language: system
        types: [typ]
        files: ^(src|template|examples|tests|docs)/.*\.(typ)$
