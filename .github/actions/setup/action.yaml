name: Set up thyme toolchain
description: >-
  Install the Typst compiler pinned by typst.toml, `just`, and the fonts the
  template and examples reference. Used by every job that compiles Typst.

outputs:
  compiler:
    description: Typst compiler version read from typst.toml
    value: ${{ steps.meta.outputs.compiler }}

runs:
  using: composite
  steps:
    - name: Read typst.toml metadata
      id: meta
      shell: bash
      run: |
        set -eu
        # tomllib is stdlib from Python 3.11, and the runner image has 3.12.
        compiler="$(python3 -c 'import tomllib; print(tomllib.load(open("typst.toml","rb"))["package"]["compiler"])')"
        if [ -z "$compiler" ]; then
          echo "::error::could not read 'compiler' from typst.toml"
          exit 1
        fi
        echo "compiler=${compiler}" >> "$GITHUB_OUTPUT"

    - name: Install Typst ${{ steps.meta.outputs.compiler }}, just & fonts
      shell: bash
      env:
        TYPST_VERSION: ${{ steps.meta.outputs.compiler }}
      run: |
        set -eu
        mkdir -p "$HOME/.local/bin" "$HOME/.local/share/fonts"

        curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
          | tar -xJ -C "$HOME/.local/bin" --strip-components=1 "typst-x86_64-unknown-linux-musl/typst"
        curl -fsSL "https://just.systems/install.sh" | bash -s -- --to "$HOME/.local/bin"

        # STIX Two (text + math), matching the `default-theme` font stacks.
        fonts="$HOME/.local/share/fonts"
        for f in STIXTwoText-Regular STIXTwoText-Italic STIXTwoText-SemiBold \
                 STIXTwoText-SemiBoldItalic STIXTwoText-Bold STIXTwoText-BoldItalic \
                 STIXTwoMath-Regular; do
          curl -fsSL "https://cdn.jsdelivr.net/gh/stipub/stixfonts@v2.13b171/fonts/static_otf/${f}.otf" \
            -o "${fonts}/${f}.otf"
        done

        # Commit Mono, so code blocks render with the intended metrics.
        tmp="$(mktemp -d)"
        curl -fsSL "https://github.com/eigilnikolajsen/commit-mono/releases/download/v1.143/CommitMono-1.143.zip" \
          -o "$tmp/commit-mono.zip"
        unzip -j -q "$tmp/commit-mono.zip" "*.otf" -d "$fonts"
        rm -rf "$tmp"

        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "TYPST_FONT_PATHS=${fonts}" >> "$GITHUB_ENV"

    - name: Install typstyle
      shell: bash
      run: |
        set -eu
        # The Typst CLI has no `fmt` subcommand; typstyle is the community formatter and
        # is what `just fmt` drives.
        # Pin it: typstyle's output changes between releases (it adds/removes trailing
        # commas and parentheses), so a floating version makes `just fmt` on one machine
        # report a clean tree that `just fmt --check` on CI rejects. 0.15.2 is the version
        # the tree is formatted with; bumping it means re-running `just fmt` in the same
        # commit.
        if ! command -v typstyle >/dev/null 2>&1; then
          cargo install typstyle --version 0.15.2 --locked
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
