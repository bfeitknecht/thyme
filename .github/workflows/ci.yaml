name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: just fmt --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # ruff is not preinstalled on the runner, and `just lint` only runs it when
      # present — without this the Python half of the lint job silently passes.
      - name: Install ruff
        run: pipx install ruff

      - run: just lint

  # The gate above never sees what Typst Universe sees. `typst-package-check` embeds
  # Typst's standard library with no in-development features, so `html` does not exist in
  # its world; a package that renders an HTML shell while compiling paged fails there with
  # `unknown variable: html`, and no local target reproduces that. Running the same tool
  # on every push is the only thing that catches it before a tag does.
  universe:
    name: Universe package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache typst-package-check
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/typst-package-check
          key: typst-package-check-${{ runner.os }}-v0.7.0

      - name: Install typst-package-check
        run: |
          set -eu
          # Pinned to a tag: `--git` without a rev installs whatever master happens to be,
          # so this job could start failing for reasons absent from this repository.
          if [ ! -x "$HOME/.cargo/bin/typst-package-check" ]; then
            cargo install --locked --git https://github.com/typst/package-check.git \
              --tag v0.7.0 typst-package-check
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # `_stage` builds the payload exactly as it would be submitted, so the checker sees
      # the same tree the release workflow hands to Typst Universe.
      - name: Stage the payload
        run: just _stage universe-stage thyme "$(python3 -c 'import tomllib; print(tomllib.load(open("typst.toml","rb"))["package"]["version"])')"

      # Job logs redirect to storage that some environments cannot fetch, so the findings
      # are repeated as annotations, which the API always returns.
      - name: Run typst-package-check
        run: |
          set -o pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("typst.toml","rb"))["package"]["version"])')"
          typst-package-check check "universe-stage/packages/preview/thyme/${version}" 2>&1 | tee package-check.log

      - name: Annotate findings
        if: failure()
        run: |
          tail -n 60 package-check.log || true
          grep -aE '^(error|warning)\[[a-z/-]+\]' package-check.log | sort -u | while IFS= read -r line; do
            echo "::error::${line}"
          done

  check:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run full check suite
        run: |
          set -o pipefail
          just check 2>&1 | tee check.log

      # Job logs are not always reachable (they redirect to storage that some
      # environments cannot fetch), so surface the failure as an annotation too.
      - name: Annotate failure
        if: failure()
        run: |
          echo "::error::just check failed — tail follows"
          tail -n 40 check.log || true
          grep -nE '^(error|Error|Traceback|[A-Za-z]*Error)|error:' check.log | tail -n 8 | while IFS= read -r line; do
            echo "::error::${line}"
          done
