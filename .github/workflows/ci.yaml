name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: just fmt-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # ruff is not preinstalled on the runner, and `just lint` only runs it when
      # present — without this the Python half of the lint job silently passes.
      - name: Install ruff
        run: pipx install ruff

      - run: just lint

  check:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run full check suite
        run: |
          set -o pipefail
          just check 2>&1 | tee check.log

      # Job logs are not always reachable (they redirect to storage that some
      # environments cannot fetch), so surface the failure as an annotation too.
      - name: Annotate failure
        if: failure()
        run: |
          echo "::error::just check failed — tail follows"
          tail -n 40 check.log || true
          grep -nE '^(error|Error|Traceback|[A-Za-z]*Error)|error:' check.log | tail -n 8 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Fail if generated docs are stale
        run: |
          set -eu
          just docs
          if ! git diff --quiet -- docs/manual.pdf; then
            echo "::error::docs/manual.pdf is out of date — run 'just docs' and commit the result"
            exit 1
          fi
