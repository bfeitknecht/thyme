# Publishes a release when `just release <version>` pushes a tag `v<version>`.
#
# Necessary configuration in the repository settings:
# - Secret UNIVERSE_TOKEN: a personal access token with `Contents: read and write`
#   on `UNIVERSE_REPO`. That is enough to sync the fork, push the release branch and
#   publish the GitHub Release.
#
#   It does not need access to `typst/packages`, because the `typst` org does not let a
#   fine-grained token open a pull request there. The job tries, and when that is refused
#   it writes the compare link to the job summary. Opening the PR is then one click.
# - Variable UNIVERSE_SUBMIT: set to `true` to enable the `universe-pr` job.
#   Leave it unset while a dependency is unpublished.
# - Variable UNIVERSE_REPO (optional): the fork of `typst/packages` that receives
#   the release branch. Accepts `owner/repo`, `host/owner/repo` or a full URL. The
#   host also addresses the upstream, so the fork must live on the host that serves
#   `typst/packages`. The default is `github.com/bfeitknecht/packages`.

name: Release & submit to Typst Universe

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to submit (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag & checks
    runs-on: ubuntu-latest
    outputs:
      pkg_name: ${{ steps.meta.outputs.pkg_name }}
      pkg_version: ${{ steps.meta.outputs.pkg_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup

      - name: Validate the release tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The recipe takes the version, not the tag: the ref and the dispatch input both
          # arrive as `v<version>`, so drop one `v` here and nowhere else.
          just release "${TAG#v}" --check
          {
            echo "pkg_name=$(python3 -c 'import tomllib; print(tomllib.load(open("typst.toml","rb"))["package"]["name"])')"
            echo "pkg_version=$(python3 -c 'import tomllib; print(tomllib.load(open("typst.toml","rb"))["package"]["version"])')"
          } >> "$GITHUB_OUTPUT"

      - name: Run full check suite
        run: |
          just check
          just fmt --check
          just lint

  github-release:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          just release --notes > release-notes.md
          cat >> release-notes.md <<'EOF'

          ---
          _Release notes follow [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and [Semantic Versioning](https://semver.org/spec/v2.0.0.html)._
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" docs/manual.pdf --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" docs/manual.pdf --title "$TAG" --notes-file release-notes.md
          fi

  universe-pr:
    name: Publish to Typst Universe
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    # Off until UNIVERSE_TOKEN is configured, so a tag never fails for that reason.
    if: ${{ vars.UNIVERSE_SUBMIT == 'true' }}
    env:
      PKG_NAME: ${{ needs.verify.outputs.pkg_name }}
      PKG_VER: ${{ needs.verify.outputs.pkg_version }}
      UPSTREAM_REPO: typst/packages
      UNIVERSE_REPO: ${{ vars.UNIVERSE_REPO || 'github.com/bfeitknecht/packages' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Require UNIVERSE_TOKEN
        env:
          GH_TOKEN: ${{ secrets.UNIVERSE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::missing UNIVERSE_TOKEN secret — add a token with push access to ${UNIVERSE_REPO} and PR access to ${UPSTREAM_REPO}."
            exit 1
          fi

      # Split UNIVERSE_REPO into a host and an owner/repo slug once, because `gh`
      # takes a bare slug while the git remote needs the host in the URL.
      - name: Resolve UNIVERSE_REPO
        run: |
          set -eu
          repo="${UNIVERSE_REPO#https://}"
          repo="${repo#http://}"
          repo="${repo%/}"
          repo="${repo%.git}"
          case "$repo" in
            */*/*) host="${repo%%/*}"; slug="${repo#*/}" ;;
            *)     host="github.com";   slug="$repo" ;;
          esac
          # Pattern match, not a slash count: `grep -c` counts lines, so a slug with two
          # slashes would pass and every later path would be wrong.
          case "$slug" in
            */*/*) echo "::error::UNIVERSE_REPO must name one repository, got '$UNIVERSE_REPO'."; exit 1 ;;
            */*)   ;;
            *)     echo "::error::UNIVERSE_REPO must be owner/repo, got '$UNIVERSE_REPO'."; exit 1 ;;
          esac
          echo "UNIVERSE_HOST=$host" >> "$GITHUB_ENV"
          echo "UNIVERSE_SLUG=$slug" >> "$GITHUB_ENV"

      - name: Stage Universe payload
        run: just _stage universe-stage "$PKG_NAME" "$PKG_VER"

      - name: Cache typst-package-check
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/typst-package-check
          key: typst-package-check-${{ runner.os }}-v0.7.0

      - name: Install Typst & typst-package-check
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          typst_version="$(python3 -c 'import tomllib; print(tomllib.load(open("typst.toml","rb"))["package"]["compiler"])')"
          curl -fsSL "https://github.com/typst/typst/releases/download/v${typst_version}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C "$HOME/.local/bin" --strip-components=1 "typst-x86_64-unknown-linux-musl/typst"
          # Pin the validator to a tag: `--git` without a rev installs whatever master
          # happens to be at release time, so a release can fail (or pass) for reasons
          # that do not exist in this repository's history.
          if [ ! -x "$HOME/.cargo/bin/typst-package-check" ]; then
            cargo install --locked --git https://github.com/typst/package-check.git \
              --tag v0.7.0 typst-package-check
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Compile the staged payload as Universe would
        run: |
          set -eu
          cache="${XDG_DATA_HOME:-$HOME/.local/share}/typst/packages"
          staged="universe-stage/packages/preview/${PKG_NAME}/${PKG_VER}"
          mkdir -p "${cache}/preview/${PKG_NAME}"
          cp -R "$staged" "${cache}/preview/${PKG_NAME}/${PKG_VER}"
          trap 'rm -rf "${cache}/preview/${PKG_NAME}"' EXIT
          typst compile --features html,bundle --format bundle \
            "${cache}/preview/${PKG_NAME}/${PKG_VER}/template/site.typ" bundle-check

      - name: Run typst-package-check
        run: typst-package-check check "universe-stage/packages/preview/${PKG_NAME}/${PKG_VER}"

      - name: Push branch to fork & open Draft PR
        env:
          GH_TOKEN: ${{ secrets.UNIVERSE_TOKEN }}
        run: |
          set -eu
          branch="${PKG_NAME}-${PKG_VER}"
          fork_owner="${UNIVERSE_SLUG%%/*}"
          staged="$(pwd)/universe-stage/packages/preview/${PKG_NAME}/${PKG_VER}"

          # Sync the fork before branching. A stale fork main makes the PR contain
          # unrelated upstream commits, or makes the push fail outright.
          if ! gh repo view "$UNIVERSE_SLUG" >/dev/null 2>&1; then
            gh repo fork "$UPSTREAM_REPO" --clone=false --default-branch-only
          fi
          gh repo sync "$UNIVERSE_SLUG" --source "$UPSTREAM_REPO" --branch main

          git clone --depth 1 --no-checkout --filter=blob:none \
            "https://${UNIVERSE_HOST}/${UPSTREAM_REPO}.git" packages-checkout
          cd packages-checkout
          git sparse-checkout init --cone
          git sparse-checkout set "packages/preview/${PKG_NAME}"
          git checkout -B "$branch" origin/main

          rm -rf "packages/preview/${PKG_NAME}/${PKG_VER}"
          mkdir -p "packages/preview/${PKG_NAME}"
          cp -R "$staged" "packages/preview/${PKG_NAME}/${PKG_VER}"

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add "packages/preview/${PKG_NAME}/${PKG_VER}"
          git commit -m "${PKG_NAME}:${PKG_VER}"

          git remote add fork "https://x-access-token:${GH_TOKEN}@${UNIVERSE_HOST}/${UNIVERSE_SLUG}.git"
          git push --force fork "HEAD:refs/heads/${branch}"

          cat > ../pr-body.md <<EOF
          I am submitting \`${PKG_NAME}:${PKG_VER}\` from https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${PKG_VER}.

          - [x] Added a \`typst.toml\` file with all required keys
          - [x] Added a \`README.md\` with documentation and runnable \`@preview\` examples
          - [x] Dual-licensed under \`MIT AND MIT-0\` (\`MIT\` for library code, \`MIT-0\` for \`template/\` and \`examples/\`)
          - [x] Tested locally and in CI across \`bundle\`, \`html\`, and \`paged\` targets with \`typst-package-check\`
          - [x] Excluded documentation PDFs, preview images, and \`examples/\` from the compiler download archive
          EOF

          # Opening the PR is best-effort. The branch and the GitHub Release are the
          # deliverables; a pull request into typst/packages needs permissions that a
          # fine-grained token cannot have, because the org restricts them. So a refused
          # PR must not mark the release as failed. It writes the compare link to the job
          # summary instead, and one click finishes the submission.
          compare="https://${UNIVERSE_HOST}/${UPSTREAM_REPO}/compare/main...${fork_owner}:${branch}"
          existing="$(gh pr list --repo "${UPSTREAM_REPO}" --head "${fork_owner}:${branch}" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            echo "The submission PR is already open: ${existing}"
          elif gh pr create \
              --draft \
              --repo "${UPSTREAM_REPO}" \
              --base main \
              --head "${fork_owner}:${branch}" \
              --title "${PKG_NAME}:${PKG_VER}" \
              --body-file ../pr-body.md; then
            echo "Opened the submission PR."
          else
            {
              echo "## One step left: open the submission PR"
              echo
              echo "\`${PKG_NAME}:${PKG_VER}\` is published as a GitHub Release and the branch"
              echo "\`${branch}\` is pushed to \`${UNIVERSE_SLUG}\`."
              echo
              echo "The token cannot open a pull request on \`${UPSTREAM_REPO}\`. Open it here:"
              echo
              echo "${compare}"
              echo
              echo "Use \`${PKG_NAME}:${PKG_VER}\` as the title, and this as the body:"
              echo
              echo "\`\`\`markdown"
              cat ../pr-body.md
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::The token cannot open a PR on ${UPSTREAM_REPO}. Open it here: ${compare}"
          fi
