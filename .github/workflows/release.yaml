name: Release & submit to Typst Universe

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to submit (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag & checks
    runs-on: ubuntu-latest
    outputs:
      pkg_name: ${{ steps.meta.outputs.pkg_name }}
      pkg_version: ${{ steps.meta.outputs.pkg_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup

      - name: Validate the release tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          just check-release "$TAG"
          {
            echo "pkg_name=$(python3 -c 'import tomllib; print(tomllib.load(open("typst.toml","rb"))["package"]["name"])')"
            echo "pkg_version=$(python3 -c 'import tomllib; print(tomllib.load(open("typst.toml","rb"))["package"]["version"])')"
          } >> "$GITHUB_OUTPUT"

      - name: Run full check suite
        run: |
          just docs
          just check
          just fmt --check
          just lint

  github-release:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup

      - name: Build manual
        run: just docs

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VER: ${{ needs.verify.outputs.pkg_version }}
        run: |
          set -eu
          just notes "$VER" > release-notes.md
          cat >> release-notes.md <<'EOF'

          ---
          _Release notes follow [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and [Semantic Versioning](https://semver.org/spec/v2.0.0.html)._
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" docs/manual.pdf --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" docs/manual.pdf --title "$TAG" --notes-file release-notes.md
          fi

  universe-pr:
    name: Open Typst Universe PR
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    # Skipped while an unpublished dependency is still vendored, or before
    # UNIVERSE_TOKEN is configured, so a tag never fails for those reasons.
    if: ${{ vars.UNIVERSE_SUBMIT == 'true' }}
    env:
      PKG_NAME: ${{ needs.verify.outputs.pkg_name }}
      PKG_VER: ${{ needs.verify.outputs.pkg_version }}
      UPSTREAM_REPO: typst/packages
      FORK_REPO: ${{ vars.UNIVERSE_FORK || 'bfeitknecht/packages' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Ensure no unpublished dependency is still vendored
        run: |
          if [ -d vendor ] && [ -n "$(find vendor -mindepth 1 -maxdepth 2 -name typst.toml 2>/dev/null)" ]; then
            echo "::error::vendor/ still contains unpublished dependencies (e.g. @preview/exemel:0.3.0). Wait for the upstream Universe release, remove vendor/, and re-run."
            exit 1
          fi

      - name: Require UNIVERSE_TOKEN
        env:
          GH_TOKEN: ${{ secrets.UNIVERSE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::missing UNIVERSE_TOKEN secret — add a PAT with push access to ${FORK_REPO} and PR access to ${UPSTREAM_REPO}."
            exit 1
          fi

      - name: Stage Universe payload
        run: just stage-universe universe-stage --allow-vendored

      - name: Cache typst-package-check
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typst-package-check
          key: typst-package-check-${{ runner.os }}-v0.7.0

      - name: Install Typst & typst-package-check
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          typst_version="$(python3 -c 'import tomllib; print(tomllib.load(open("typst.toml","rb"))["package"]["compiler"])')"
          curl -fsSL "https://github.com/typst/typst/releases/download/v${typst_version}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C "$HOME/.local/bin" --strip-components=1 "typst-x86_64-unknown-linux-musl/typst"
          # Pin the validator to a tag: `--git` without a rev installs whatever master
          # happens to be at release time, so a release can fail (or pass) for reasons
          # that do not exist in this repository's history.
          if [ ! -x "$HOME/.cargo/bin/typst-package-check" ]; then
            cargo install --locked --git https://github.com/typst/package-check.git \
              --tag v0.7.0 typst-package-check
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Compile the staged payload as Universe would
        run: |
          set -eu
          cache="${XDG_DATA_HOME:-$HOME/.local/share}/typst/packages"
          staged="universe-stage/packages/preview/${PKG_NAME}/${PKG_VER}"
          mkdir -p "${cache}/preview/${PKG_NAME}"
          cp -R "$staged" "${cache}/preview/${PKG_NAME}/${PKG_VER}"
          trap 'rm -rf "${cache}/preview/${PKG_NAME}"' EXIT
          typst compile --features html,bundle --format bundle \
            "${cache}/preview/${PKG_NAME}/${PKG_VER}/template/site.typ" bundle-check

      - name: Run typst-package-check
        run: typst-package-check check "universe-stage/packages/preview/${PKG_NAME}/${PKG_VER}"

      - name: Push branch to fork & open Draft PR
        env:
          GH_TOKEN: ${{ secrets.UNIVERSE_TOKEN }}
        run: |
          set -eu
          branch="${PKG_NAME}-${PKG_VER}"
          fork_owner="${FORK_REPO%%/*}"
          staged="$(pwd)/universe-stage/packages/preview/${PKG_NAME}/${PKG_VER}"

          git clone --depth 1 --no-checkout --filter=blob:none \
            "https://github.com/${UPSTREAM_REPO}.git" packages-checkout
          cd packages-checkout
          git sparse-checkout init --cone
          git sparse-checkout set "packages/preview/${PKG_NAME}"
          git checkout -B "$branch" origin/main

          rm -rf "packages/preview/${PKG_NAME}/${PKG_VER}"
          mkdir -p "packages/preview/${PKG_NAME}"
          cp -R "$staged" "packages/preview/${PKG_NAME}/${PKG_VER}"

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add "packages/preview/${PKG_NAME}/${PKG_VER}"
          git commit -m "${PKG_NAME}:${PKG_VER}"

          git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/${FORK_REPO}.git"
          git push --force fork "HEAD:refs/heads/${branch}"

          cat > ../pr-body.md <<EOF
          I am submitting \`${PKG_NAME}:${PKG_VER}\` from https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${PKG_VER}.

          - [x] Added a \`typst.toml\` file with all required keys
          - [x] Added a \`README.md\` with documentation and runnable \`@preview\` examples
          - [x] Dual-licensed under \`MIT AND MIT-0\` (\`MIT\` for library code, \`MIT-0\` for \`template/\` and \`examples/\`)
          - [x] Tested locally and in CI across \`bundle\`, \`html\`, and \`paged\` targets with \`typst-package-check\`
          - [x] Excluded documentation PDFs, preview images, and \`examples/\` from the compiler download archive
          EOF

          existing="$(gh pr list --repo "${UPSTREAM_REPO}" --head "${fork_owner}:${branch}" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            echo "Updated existing Draft PR: ${existing}"
          else
            gh pr create \
              --draft \
              --repo "${UPSTREAM_REPO}" \
              --base main \
              --head "${fork_owner}:${branch}" \
              --title "${PKG_NAME}:${PKG_VER}" \
              --body-file ../pr-body.md
          fi
