# Mirror of .github/workflows/ci.yaml for a Forgejo runner. Differences: the
# runner label and fully-qualified action URLs. The setup action is local
# (.github/actions/setup) and works the same.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Full check suite
        run: |
          just check
          just fmt --check
          just lint
